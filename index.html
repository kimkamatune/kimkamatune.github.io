<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 김카마튠 — 음악 추천기</title>
<style>
  :root{
    --bg:#0b0d10; --bg2:#12161c; --card:#171c24; --line:#242c38;
    --txt:#eef2f7; --sub:#9aa7b8; --accent:#1ed760; --accent2:#8b5cf6;
    --like:#1ed760; --pass:#ff5d73;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 10% -10%, #1b2a3a 0%, transparent 60%),
                        radial-gradient(900px 500px at 100% 0%, #2a1b3a 0%, transparent 55%), var(--bg);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  header{padding:22px 18px 10px; max-width:760px; margin:0 auto}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.2px}
  .logo span.dot{color:var(--accent)}
  .sub{color:var(--sub); font-size:13px; margin-top:6px; line-height:1.5}
  main{max-width:760px; margin:0 auto; padding:14px 18px}
  .panel{display:none}
  .panel.on{display:block}
  .grp{margin:16px 0 6px}
  .grp h3{margin:0 0 8px; font-size:12.5px; color:var(--sub); font-weight:700; letter-spacing:.4px}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{
    background:var(--bg2); border:1px solid var(--line); color:var(--txt); border-radius:11px;
    padding:8px 13px; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; user-select:none;
  }
  .chip:hover{border-color:#3b4759}
  .chip.on{background:linear-gradient(180deg,#1ed76033,#1ed76018); border-color:var(--accent); color:#d9ffe7}
  .moodchip.on{background:linear-gradient(180deg,#8b5cf633,#8b5cf618); border-color:var(--accent2); color:#e9ddff}
  .go{
    width:100%; margin-top:18px; border:0; border-radius:14px; padding:15px; font-size:15.5px; font-weight:800;
    color:#04140a; background:linear-gradient(180deg,#2ee86c,#16b64c); cursor:pointer; letter-spacing:-.2px;
  }
  .go:active{transform:translateY(1px)}
  .cards{display:flex; flex-direction:column; gap:12px; margin-top:18px}
  .card{background:linear-gradient(180deg,#1a212b,#141a22); border:1px solid var(--line); border-radius:16px; padding:15px 15px 13px; animation:pop .28s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .card .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .ttl{font-size:16px; font-weight:800; letter-spacing:-.2px; line-height:1.28; word-break:break-word}
  .art{color:var(--sub); font-size:13px; margin-top:3px; word-break:break-word}
  .badge{font-size:10.5px; font-weight:800; padding:4px 7px; border-radius:7px; white-space:nowrap}
  .badge.new{background:#8b5cf62e; color:#c9b4ff; border:1px solid #8b5cf655}
  .badge.own{background:#ffffff10; color:#9aa7b8; border:1px solid #ffffff18}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .tag{font-size:11.5px; color:#c7d3e2; background:#ffffff0d; border:1px solid #ffffff12; padding:4px 8px; border-radius:8px}
  .why{font-size:12.5px; color:#8fd7a7; margin-top:10px; line-height:1.5}
  .acts{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  .acts button{
    flex:1 1 calc(50% - 4px); min-width:0; border-radius:11px; padding:10px 4px; font-size:12.5px; font-weight:800;
    cursor:pointer; border:1px solid var(--line); background:#0f141b; color:var(--txt);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .acts .like{border-color:#1ed76055; color:#7bf0a5}
  .acts .pass{border-color:#ff5d7355; color:#ff9aa8}
  .acts .sp, .acts .yt, .acts .melon{flex:1 1 calc(33.333% - 5px); font-size:12px; padding:10px 2px}
  .acts .sp{border-color:#1ed76055; color:#8ef0b1}
  .acts .yt{border-color:#ff5d7355; color:#ffb3bd}
  .acts .melon{border-color:#00cd3c66; color:#a8ffcf}
  .mini{font-size:11.5px; color:var(--sub); text-align:center; margin-top:14px; line-height:1.6}
  .stats{margin-top:16px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:14px}
  .stats h4{margin:0 0 10px; font-size:13px; color:var(--sub)}
  .bar{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px}
  .bar .nm{width:96px; color:#c7d3e2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar .tr{flex:1; height:7px; background:#ffffff0d; border-radius:99px; overflow:hidden}
  .bar .fl{height:100%; background:linear-gradient(90deg,#1ed760,#8b5cf6); border-radius:99px}
  .bar .vl{width:34px; text-align:right; color:var(--sub)}
  .dna h2{font-size:17px; margin:20px 0 8px}
  .dna p{color:#c2cedd; font-size:13.5px; line-height:1.72; margin:8px 0}
  .dna ul{color:#c2cedd; font-size:13.5px; line-height:1.7; padding-left:20px}
  .kv{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0}
  .kv div{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:11px}
  .kv b{display:block; font-size:17px; color:#fff}
  .kv span{font-size:11.5px; color:var(--sub)}
  .lib{display:flex; flex-direction:column; gap:9px}
  .lib .row{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:11px 12px}
  .lib .row .t{font-size:13.5px; font-weight:700}
  .lib .row .s{font-size:11.5px; color:var(--sub); margin-top:2px}
  .lib a{color:var(--accent); font-size:11.5px; text-decoration:none; font-weight:700}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:26px 0; line-height:1.7}
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#e9fff2; color:#06220f; font-weight:800; font-size:13px; padding:11px 16px; border-radius:12px;
    transition:.25s; pointer-events:none; z-index:9; box-shadow:0 8px 24px #0009;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  footer{max-width:760px; margin:26px auto 0; padding:0 18px; color:#5f6b7c; font-size:11px; line-height:1.7}
  footer a{color:#7f8b9c}
  .resetlink{background:none; border:0; color:#6b7787; font-size:11.5px; text-decoration:underline; cursor:pointer; margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="logo">🎵 김카마튠 <span class="dot">·</span> <span style="font-weight:600;font-size:14px;color:#9aa7b8">음악 추천기</span></div>
  <div class="sub">상황·기분·템포를 고르면 취향에 맞는 곡을 골라 주는 김카마튠 음악 추천기입니다.<br>
  좋아요·패스를 누를수록 이 브라우저의 추천이 더 정확해집니다.</div>
</header>

<main>
  <!-- 추천 -->
  <section class="panel on" id="p-rec">
    <div class="grp"><h3>지금 상황</h3><div class="chips" id="sit"></div></div>
    <div class="grp"><h3>기분</h3><div class="chips" id="mood"></div></div>
    <div class="grp"><h3>템포</h3><div class="chips" id="tempo"></div></div>
    <div class="grp"><h3>언어</h3><div class="chips" id="lang"></div></div>
    <button class="go" id="pick">🎧 이 조건으로 5곡 추천</button>
    <div class="cards" id="cards"></div>
    <div class="mini" id="hint">위에서 상황을 고르고 버튼을 누르면 추천이 시작됩니다.</div>
    <div class="stats" id="stats" style="display:none">
      <h4>학습된 취향 (좋아요·패스 반영)</h4>
      <div id="bars"></div>
      <button class="resetlink" id="reset">학습 기록 초기화</button>
    </div>
  </section>

</main>

<footer>
  307곡의 큐레이션 데이터에서 곡·아티스트·분위기를 확인해 추천합니다. 로그인 없이도 스포티파이·유튜브·멜론 검색 링크로 바로 열립니다.
</footer>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TRACKS = DATA.tracks;
const GENRE = Object.fromEntries(Object.entries(DATA.buckets).map(([k,v])=>[k,v.genre]));
const BNAME = {jp_rock:'일본 록·J-POP', kr_indie:'한국 인디·R&B', kr_hiphop:'한국 힙합·R&B',
  k_pop:'K-POP', old_ballad:'2000년대 발라드', band_rock:'밴드 록', jazz_lofi:'재즈·로파이',
  game_ost:'게임·OST', west_pop:'해외 팝'};
const LANGS = {ko:'한국어', ja:'일본어', en:'영어'};

const SITS = [
  {id:'drive',  label:'🚗 드라이브', e:3.5, bpm:124, moods:['설렘','신남']},
  {id:'focus',  label:'📚 집중',     e:1.6, bpm:96,  moods:['집중','차분']},
  {id:'dawn',   label:'🌙 새벽',     e:1.4, bpm:88,  moods:['새벽','차분','우울']},
  {id:'work',   label:'🏃 운동',     e:4.4, bpm:142, moods:['운동','신남']},
  {id:'cafe',   label:'☕ 카페',     e:2.4, bpm:104, moods:['차분','설렘']},
  {id:'switch', label:'🔁 기분전환', e:4.0, bpm:130, moods:['신남','설렘']},
];
const MOODS = ['전체','설렘','차분','우울','신남'];
const TEMPOS = [{id:'all',label:'전체',min:0,max:999},{id:'slow',label:'느림',min:0,max:95},{id:'mid',label:'보통',min:96,max:125},{id:'fast',label:'빠름',min:126,max:999}];
const LANGSEL = [{id:'all',label:'전체'},{id:'ko',label:'한국어'},{id:'ja',label:'일본어'},{id:'en',label:'영어'}];

const state = {sit:'dawn', mood:'전체', tempo:'all', lang:'all', seen:new Set(), shown:[]};
const KEY = 'kimtune.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {w:{}, likes:[], passes:0}; }catch(e){ return {w:{}, likes:[], passes:0}; } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
let store = load();
if(!store.w) store.w = {};
if(!store.likes) store.likes = [];
if(store.passes === undefined) store.passes = 0;

/* ---------- UI ---------- */
function renderChips(){
  const el = document.getElementById('sit'); el.innerHTML='';
  SITS.forEach(s=>{
    const b=document.createElement('button'); b.className='chip'+(state.sit===s.id?' on':''); b.textContent=s.label;
    b.onclick=()=>{ state.sit=s.id; renderChips(); };
    el.appendChild(b);
  });
  const em = document.getElementById('mood'); em.innerHTML='';
  MOODS.forEach(m=>{
    const b=document.createElement('button'); b.className='chip moodchip'+(state.mood===m?' on':''); b.textContent=m;
    b.onclick=()=>{ state.mood=m; renderChips(); };
    em.appendChild(b);
  });
  const et = document.getElementById('tempo'); et.innerHTML='';
  TEMPOS.forEach(t=>{
    const b=document.createElement('button'); b.className='chip'+(state.tempo===t.id?' on':''); b.textContent=t.label;
    b.onclick=()=>{ state.tempo=t.id; renderChips(); };
    et.appendChild(b);
  });
  const elg = document.getElementById('lang'); elg.innerHTML='';
  LANGSEL.forEach(l=>{
    const b=document.createElement('button'); b.className='chip'+(state.lang===l.id?' on':''); b.textContent=l.label;
    b.onclick=()=>{ state.lang=l.id; renderChips(); };
    elg.appendChild(b);
  });
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), 1500);
}

/* ---------- 추천 엔진 ---------- */
function score(tr, sit, mood, tempo){
  let s = 0;
  s += 3 - Math.min(3, Math.abs(tr.e - sit.e) * 1.4);          // 에너지 근접
  s += 2 - Math.min(2, Math.abs(tr.bpm - sit.bpm) / 42);        // 템포 근접
  if(sit.moods.some(m => tr.m.includes(m))) s += 1.2;           // 상황 무드
  if(mood !== '전체' && tr.m.includes(mood)) s += 1.8;          // 고른 기분
  if(mood !== '전체' && !tr.m.includes(mood)) s -= 0.6;
  if(tempo !== 'all'){
    const t = TEMPOS.find(x=>x.id===tempo);
    if(tr.bpm >= t.min && tr.bpm <= t.max) s += 1.4; else s -= 1.0;
  }
  const w = store.w[tr.b] || 0;                                  // 학습 가중치
  s += w * 2.2;
  if(tr.rec) s += 1.2;                                           // 새 추천곡 우대
  s += Math.random() * 0.9;
  return s;
}

function buildPool(){
  let pool = TRACKS.filter(t => !state.seen.has(t.i));
  if(state.lang !== 'all') pool = pool.filter(t => t.lang === state.lang);
  if(state.mood !== '전체') pool = pool.filter(t => t.m !== null && (t.m.includes(state.mood) || Math.random()<0.25));
  return pool;
}

function pick(n){
  const sit = SITS.find(s=>s.id===state.sit);
  let pool = buildPool();
  // 새 추천 곡이 3곡 미만으로 남았으면 되감아, 매번 새 곡이 중심이 되게 한다
  if(pool.filter(t => t.rec).length < Math.min(3, n)){
    TRACKS.filter(t => t.rec).forEach(t => state.seen.delete(t.i));
    pool = buildPool();
  }
  if(pool.length < n){
    state.seen.clear();
    pool = TRACKS.slice();
    if(state.lang !== 'all') pool = pool.filter(t => t.lang === state.lang);
  }
  const sorted = pool
    .map(t => ({t, s: score(t, sit, state.mood, state.tempo)}))
    .sort((a,b)=>b.s-a.s)
    .map(x=>x.t);
  // 새 추천 곡을 먼저 배정하고, 새 곡이 모자라면 큐레이션 곡으로 남은 자리를 채운다
  const ranked = sorted.filter(t => t.rec).slice(0, n);
  for(const t of sorted){
    if(ranked.length >= n) break;
    if(!ranked.includes(t)) ranked.push(t);
  }
  ranked.forEach(t=>state.seen.add(t.i));
  state.shown = ranked;
  renderCards(ranked, sit);
  document.getElementById('stats').style.display = 'block';
  renderBars();
  document.getElementById('hint').textContent =
    `${sit.label} · ${state.mood==='전체'?'기분 전체':state.mood} · ${TEMPOS.find(t=>t.id===state.tempo).label} · ${LANGSEL.find(l=>l.id===state.lang).label} 기준 5곡`;
}

function why(tr, sit){
  const parts = [];
  parts.push(`${BNAME[tr.b]} · BPM≈${tr.bpm}`);
  const hit = sit.moods.filter(m=>tr.m.includes(m));
  if(hit.length) parts.push(`${hit.join('·')} 무드`);
  const w = store.w[tr.b] || 0;
  if(w > 0.2) parts.push(`${BNAME[tr.b]}를 자주 좋아요`);
  if(w < -0.2) parts.push(`다만 ${BNAME[tr.b]} 패스가 있었음`);
  if(tr.rec) parts.push('새로 찾은 추천');
  return '왜 이 곡? ' + parts.join(' · ');
}

function spLink(tr){
  if(tr.id) return 'https://open.spotify.com/track/' + tr.id;
  return 'https://open.spotify.com/search/' + encodeURIComponent(tr.t + ' ' + tr.a);
}
function ytLink(tr){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(tr.t + ' ' + tr.a); }

function melonQuery(tr){
  return tr.a && tr.a !== '(로컬 파일)' ? tr.t + ' ' + tr.a : tr.t;
}
function melonLink(tr){
  const q = encodeURIComponent(melonQuery(tr));
  const mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  return mobile
    ? 'https://m2.melon.com/search/searchResult.htm?s=' + q
    : 'https://www.melon.com/search/total/index.htm?q=' + q;
}

function renderCards(list, sit){
  const box = document.getElementById('cards'); box.innerHTML='';
  list.forEach(tr=>{
    const c = document.createElement('div'); c.className='card';
    c.innerHTML = `
      <div class="top">
        <div>
          <div class="ttl">${esc(tr.t)}</div>
          <div class="art">${esc(tr.a)}</div>
        </div>
        <div class="badge ${tr.rec?'new':'own'}">${tr.rec?'새 추천':'큐레이션'}</div>
      </div>
      <div class="tags">
        <span class="tag">${BNAME[tr.b]}</span>
        <span class="tag">${LANGS[tr.lang]||''}</span>
        <span class="tag">BPM≈${tr.bpm}</span>
        <span class="tag">에너지 ${'●'.repeat(tr.e)}${'○'.repeat(5-tr.e)}</span>
      </div>
      <div class="why">${esc(why(tr, sit))}</div>
      <div class="acts">
        <button class="like">👍 좋아요</button>
        <button class="pass">👎 패스</button>
        <button class="sp">🟢 스포티파이</button>
        <button class="yt">▶ 유튜브</button>
        <button class="melon">🍈 멜론</button>
      </div>`;
    c.querySelector('.like').onclick = ()=>{ feedback(tr, +1); c.style.opacity=.45; };
    c.querySelector('.pass').onclick = ()=>{ feedback(tr, -1); c.style.opacity=.45; };
    c.querySelector('.sp').onclick = ()=> window.open(spLink(tr), '_blank', 'noopener');
    c.querySelector('.yt').onclick = ()=> window.open(ytLink(tr), '_blank', 'noopener');
    c.querySelector('.melon').onclick = ()=> window.open(melonLink(tr), '_blank', 'noopener');
    box.appendChild(c);
  });
}

function feedback(tr, dir){
  if(dir > 0){
    store.w[tr.b] = Math.min(3, (store.w[tr.b]||0) + 0.25);
    if(!store.likes.some(x=>x.i===tr.i)) store.likes.unshift({i:tr.i, t:tr.t, a:tr.a, b:tr.b, id:tr.id, at:Date.now()});
    store.likes = store.likes.slice(0, 300);
    toast('좋아요 — ' + BNAME[tr.b] + ' 가중치 ↑');
  } else {
    store.w[tr.b] = Math.max(-2, (store.w[tr.b]||0) - 0.15);
    store.passes = (store.passes||0) + 1;
    toast('패스 — ' + BNAME[tr.b] + ' 가중치 ↓');
  }
  save(store); renderBars();
}

function renderBars(){
  const box = document.getElementById('bars'); if(!box) return;
  const rows = Object.entries(BNAME).map(([k,name])=>({k,name, w: store.w[k]||0}))
    .filter(r=>Math.abs(r.w)>0.001).sort((a,b)=>b.w-a.w);
  if(!rows.length){ box.innerHTML = '<div class="mini">아직 기록이 없습니다. 좋아요/패스를 누르면 여기에 쌓입니다.</div>'; return; }
  const max = Math.max(...rows.map(r=>Math.abs(r.w)), 0.5);
  box.innerHTML = rows.map(r=>`
    <div class="bar"><div class="nm">${r.name}</div>
      <div class="tr"><div class="fl" style="width:${Math.round(Math.abs(r.w)/max*100)}%;${r.w<0?'background:linear-gradient(90deg,#ff5d73,#8b5cf6)':''}"></div></div>
      <div class="vl">${r.w>0?'+':''}${r.w.toFixed(2)}</div></div>`).join('');
}

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- events ---------- */
document.getElementById('pick').onclick = ()=> pick(5);
document.getElementById('reset').onclick = ()=>{
  store = {w:{}, likes:[], passes:0}; save(store); renderBars(); toast('학습 기록을 지웠습니다');
};

renderChips(); renderBars();
// 첫 진입 시 한 번 추천
window.addEventListener('load', ()=>{ if(!document.getElementById('cards').children.length) pick(5); });
</script>
</body>
